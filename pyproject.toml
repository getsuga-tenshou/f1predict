[project]
name = "f1predict"
version = "0.1.0"
description = "Probabilistic Formula 1 race-winner prediction with leakage-safe walk-forward evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
paper = ["reportlab>=4"]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
f1predict = "f1predict.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1predict"]
# The built frontend is gitignored but ships in the wheel when it has been built.
artifacts = ["src/f1predict/dashboard/static/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
